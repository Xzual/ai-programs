[package]
name = "edith"
version = "1.0.0"
description = "E.D.I.T.H. Personal AI System"
authors = ["E.D.I.T.H."]
edition = "2021"

[lib]
name = "edith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "edith"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
